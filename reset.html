<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>清空本地游戏数据</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c0b0d;
        color: #f4ead7;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .reset-card {
        width: min(560px, calc(100vw - 32px));
        padding: 24px 28px;
        border: 1px solid rgba(244, 234, 215, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: rgba(244, 234, 215, 0.78);
      }

      .hint {
        margin-top: 16px;
        font-size: 14px;
        color: rgba(244, 234, 215, 0.58);
      }
    </style>
  </head>
  <body>
    <div class="reset-card">
      <h1>正在清空本地数据…</h1>
      <p>这个页面会删除当前地址下的游戏存档、金库记录和进行中对局，然后自动跳回首页。</p>
      <p class="hint">如果 2 秒后还没跳转，请手动回到首页再试一次。</p>
    </div>
    <script>
      try {
        localStorage.removeItem("blacklight-bar-progress");
        localStorage.removeItem("blacklight-bar-current-run");
        sessionStorage.clear();
      } catch (error) {
        console.warn("Failed to reset local game storage", error);
      }
      setTimeout(() => {
        location.replace("./index.html?fresh=20260330-reset");
      }, 180);
    </script>
  </body>
</html>
